name: CI

# The gate is `make checkall-ci`. tower-defense-xr depends on the sibling mux-xr checkout through a `file:`
# dependency, so both repos are checked out side by side under $GITHUB_WORKSPACE.
# The mux-xr commit is recorded once, in toolkit-release.json.
# Deploys run only after the gate, only on a push to main, and only once the repository variable
# PAGES_ENABLED is "true" (set it after the GitHub Pages site exists).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gate:
    name: make checkall-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tower-defense-xr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tower-defense-xr
          persist-credentials: false

      - name: Read the pinned toolkit release
        id: toolkit
        run: |
          repo=$(jq -er '.repo' tower-defense-xr/toolkit-release.json)
          sha=$(jq -er '.sha' tower-defense-xr/toolkit-release.json)
          case "$sha" in
            *[!0-9a-f]* | "") echo "toolkit-release.json sha is not lowercase hex: $sha" >&2; exit 1 ;;
          esac
          if [ "${#sha}" -ne 40 ]; then
            echo "toolkit-release.json sha must be a full 40-character commit: $sha" >&2
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out mux-xr at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.toolkit.outputs.repo }}
          ref: ${{ steps.toolkit.outputs.sha }}
          path: mux-xr
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install mux-xr dependencies
        working-directory: mux-xr
        run: bun install --frozen-lockfile

      - name: Install tower-defense-xr dependencies
        working-directory: tower-defense-xr
        run: bun install --frozen-lockfile

      - name: Gate
        working-directory: tower-defense-xr
        run: make checkall-ci

      # checkall-ci ran the production build, so this is the exact tree that passed the gate.
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: tower-defense-xr/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
